<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlucoPlate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f1;--sf:#fff;--ink:#16302b;--mu:#5b6f6a;--ln:#d5e2dc;--lf:#1f7a5a;--ls:#dcf0e6;--mg:#f2a516;--ch:#c2402c;--cs:#fbe4df;--as:#fdf0d0;--am:#8a5a00;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b18;--sf:#17272a;--ink:#e6f1ed;--mu:#9bb3ac;--ln:#2a3f3c;--lf:#4fc596;--ls:#173a2e;--mg:#f2b441;--ch:#ff8d78;--cs:#3a1d19;--as:#3a2f12;--am:#f2b441;--on:#06231a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1b18;--sf:#17272a;--ink:#e6f1ed;--mu:#9bb3ac;--ln:#2a3f3c;--lf:#4fc596;--ls:#173a2e;--mg:#f2b441;--ch:#ff8d78;--cs:#3a1d19;--as:#3a2f12;--am:#f2b441;--on:#06231a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--mg);outline-offset:2px}
.w{max-width:1080px;margin:0 auto;padding:14px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 0 10px}
.logo{font:800 23px "Bricolage Grotesque",sans-serif;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:var(--lf);position:relative}.logo i:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--mg)}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.nav button{flex:0 0 auto;border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 15px;font-weight:600}
.nav button[aria-current=page]{background:var(--lf);border-color:var(--lf);color:var(--on)}
.bdg{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ls);color:var(--lf)}.bdg.p{background:var(--mg);color:#2b1d00}
.bn{border-radius:12px;padding:11px 15px;margin-bottom:10px;font-weight:500}.bn.c{background:var(--cs);color:var(--ch);border:1.5px solid var(--ch)}.bn.i{background:var(--as);border:1px solid var(--ln);font-size:14px}
.g{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.g,.g2{grid-template-columns:1fr}}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:17px;margin-bottom:14px}.pn h2{font-size:20px;margin-bottom:3px}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}.sm{font-size:13px;color:var(--mu)}
.ml{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.ml:first-of-type{border-top:0}
.sl{font:700 14px "Bricolage Grotesque",sans-serif;color:var(--lf)}.nm{font-weight:600}.mt{font-size:13px;color:var(--mu)}
.cp{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin:3px 4px 0 0}.lo{background:var(--ls);color:var(--lf)}.md{background:var(--as);color:var(--am)}.hi{background:var(--cs);color:var(--ch)}
.pr{font:700 17px "Bricolage Grotesque",sans-serif;text-align:right}
.b{border:0;background:var(--lf);color:var(--on);font-weight:600;border-radius:11px;padding:9px 16px}.b.gh{background:transparent;border:1.5px solid var(--ln);color:var(--ink)}.b.s{padding:3px 10px;font-size:13px;margin-top:5px}.b.d{background:var(--cs);color:var(--ch)}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mtr{margin:11px 0}.mtr .r{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.bar{height:11px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:5px}.bar>div{height:100%;background:var(--lf);transition:width .4s}.bar>.o{background:var(--ch)}
label{font-size:13px;color:var(--mu);display:block;margin-top:8px}
input,select{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--ln);background:var(--bg);margin-top:3px}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:560px){.fr{grid-template-columns:1fr 1fr}}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.dc{border:1px solid var(--ln);border-radius:14px;padding:12px;background:var(--bg)}
.st{background:var(--ls);border-radius:12px;padding:11px;margin-top:10px;font-size:14px}.er{color:var(--ch);font-size:14px;margin-top:6px}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}
svg text{fill:var(--mu);font-size:11px}.tg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:5}
.au{max-width:440px;margin:6vh auto}.dm{display:grid;gap:6px}.dm button{text-align:left;border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="w" id="app"></div><div class="tg" id="tg" hidden role="status"></div>
<script>
// name, slot (m morning, M lunch/dinner, A afternoon, E evening, S snack), KES, carbs, protein, fat, GI, flags (s soft, k kid)
const D=[["Uji wa Wimbi (finger millet porridge)","m",40,28,4,1,54,"s"],["Uji wa Mchanganyiko (mixed flour)","m",50,30,8,4,52,"sk"],["Sweet maize uji","m",30,42,3,1,78,"sk"],["Boiled eggs & kachumbari","m",50,4,13,10,15,"k"],["Omelette with sukuma","m",70,6,14,16,15,"k"],["Mandazi & black tea","m",50,46,5,14,75,""],["Chapati & black tea","m",40,38,6,9,66,""],["Nduma (arrowroot) & tea","m",50,46,3,1,56,"s"],["Sweet potato & tea","m",50,52,3,1,63,"sk"],["Brown bread & avocado","m",55,34,8,14,55,""],["Oats porridge","m",60,34,9,6,55,"sk"],["Maziwa lala","m",50,12,8,8,35,"sk"],
["Ugali & sukuma wiki","M",60,68,9,6,70,"s"],["Ugali, beef stew & sukuma","M",180,70,30,20,62,""],["Ugali, omena & kachumbari","M",100,68,26,12,60,""],["Githeri (maize & beans)","M",70,72,20,8,48,""],["Mukimo","M",100,80,12,8,68,"s"],["Rice & beans","M",110,92,17,9,62,"k"],["Chapati & beans","M",100,88,17,16,64,"k"],["Ndengu & chapati","M",90,64,18,12,50,""],["Matoke & beef stew","M",200,62,26,18,55,"s"],["Millet ugali, terere & tilapia","M",280,52,38,20,50,""],["Kuku choma & kachumbari","M",350,7,46,22,15,"k"],["Stewed tilapia & sukuma","M",300,8,38,16,20,"s"],["Beef pilau","M",220,88,24,24,70,"k"],["Chips mayai","A",150,62,14,28,75,"k"],["Goat nyama choma","M",450,6,52,32,12,""],["Supu ya mbuzi (goat soup)","E",120,5,26,12,10,"s"],["Small ugali, cabbage & beans","M",70,46,13,6,55,"s"],["Ugali & managu","M",70,68,11,8,66,"s"],["Mbaazi karai & chapati","M",120,70,17,18,52,""],["Coconut rice & ndengu","M",130,84,17,14,60,""],["Kienyeji chicken & sukuma","M",280,8,34,18,20,"s"],["Eggs, sukuma & chapati","M",100,42,15,20,55,"k"],["Matoke & beans","M",80,64,14,6,50,"s"],["Sorghum ugali & ndengu","M",90,62,19,8,48,""],
["Roasted groundnuts","S",30,6,10,20,14,""],["Mahindi choma","S",40,32,4,2,55,"k"],["Guava","S",20,14,2,1,30,"k"],["Pawpaw slice","S",40,15,1,0,60,"k"]].map((r,i)=>mk(i,r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));
function mk(id,name,t,cost,c,p,f,gi,fl){return{id,name,t,cost,c,p,f,gi,fl:fl||"",kcal:4*c+4*p+9*f}}
const LV={healthy:[75,260,"Healthy"],prediabetes:[65,200,"Prediabetes"],type2_controlled:[60,180,"Type 2, controlled"],type2_high_risk:[55,150,"Type 2, high risk"],critical:[50,120,"Critical"]};
const ST={student:[300,2200,1,"b","Student"],child:[350,1700,.9,"k","Child"],working_class:[450,2400,1.1,"h","Working class"],elderly:[300,1700,.9,"s","Elderly"],rural_low_income:[250,2000,1,"b","Rural, low income"]};
const SL=["Morning","Afternoon","Evening"],TL={m:"Morning",M:"Lunch or dinner",A:"Afternoon",E:"Evening",S:"Snack"};
const lim=(s,l)=>({gi:LV[l][0],carb:Math.round(LV[l][1]*ST[s][2]/5)*5,budget:ST[s][0],kcal:ST[s][1]});
const PERS=[["Brian Otieno","brian.student","student","healthy",21,68,68],["Amani Wekesa","amani.child","child","prediabetes",11,46,42],["Grace Wanjiru","grace.worker","working_class","type2_controlled",38,82,74],["Joseph Kamau","joseph.elder","elderly","type2_high_risk",68,79,72],["Esther Achieng","esther.rural","rural_low_income","critical",52,91,80]];
const $=id=>document.getElementById(id),KES=n=>"KSh "+Math.round(n).toLocaleString("en-KE"),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day=o=>new Date(Date.now()+o*864e5).toISOString().slice(0,10);
let db,tok=null,me=null,view="dash",draft=null,filt={q:"",t:"all",safe:false};
function save(){try{localStorage.setItem("gp_db",JSON.stringify(db));if(tok)localStorage.setItem("gp_tok",tok)}catch(e){}}
const all=()=>D.concat(db.custom),dish=id=>all().find(d=>d.id===id);
const pool=(s,ex)=>all().filter(d=>d.t!=="S"&&!(ex&&ex.has(d.id))&&(d.t==="m"?s===0:d.t==="M"?s>0:d.t==="A"?s===1:s===2));
const tagOf=(d,p)=>p==="b"?d.cost<=(d.t==="m"?55:100):p==="h"?d.p>=25:d.fl.includes(p);
function ev(c,u){const cost=c.reduce((a,d)=>a+d.cost,0),cb=c.reduce((a,d)=>a+d.c,0),kc=c.reduce((a,d)=>a+d.kcal,0);
 const v=Math.max(0,cost-u.budget)/u.budget+Math.max(0,cb-u.carb)/u.carb+c.reduce((a,d)=>a+Math.max(0,d.gi-u.gi),0)/100,t=u.kcal*.8,gw=.7*(1-u.gi/100);
 return{v,sc:Math.abs(kc-t)/t*1.5+c.reduce((a,d)=>a+d.gi,0)/3/100*gw+cost/u.budget*.15-c.reduce((a,d)=>a+(tagOf(d,ST[u.setting][3])?1:0),0)*.05}}
function gen(u,ex){let b=null;const P=[0,1,2].map(i=>pool(i,ex).length?pool(i,ex):pool(i));
 for(const m of P[0])for(const a of P[1])for(const e of P[2]){if(m===a||a===e||m===e)continue;const r=ev([m,a,e],u);if(!b||r.v<b.v-1e-9||(Math.abs(r.v-b.v)<=1e-9&&r.sc<b.sc))b={c:[m,a,e],...r}}return b.c}
const band=g=>g<=55?["lo","Low GI"]:g<=69?["md","Medium GI"]:["hi","High GI"];
const tot=c=>({cost:c.reduce((a,d)=>a+d.cost,0),c:c.reduce((a,d)=>a+d.c,0),kc:c.reduce((a,d)=>a+d.kcal,0),gi:Math.max(...c.map(d=>d.gi))});
// ---- mock backend (the same shape as the real API) ----
function seed(){db={users:[],custom:[],plans:[],weights:[],n:1};
 PERS.forEach((p,i)=>{const u={id:i+1,name:p[0],email:p[1]+"@glucoplate.demo",pw:"Demo@12345",setting:p[2],level:p[3],age:p[4],...lim(p[2],p[3]),target:p[6],premium:false,demo:true};db.users.push(u);
  for(let k=0;k<8;k++)db.weights.push({u:u.id,date:day(-7*(7-k)),w:+(p[5]+(p[6]-p[5])*(k/7)*.35).toFixed(1)});
  const ex=new Set();[-2,-1].forEach(o=>{const c=gen(u,ex.size>20?new Set():ex);c.forEach(d=>ex.add(d.id));db.plans.push({id:db.n++,u:u.id,date:day(o),budget:u.budget,items:c.map((d,j)=>({d:d.id,s:j,st:"eaten"}))})})});save()}
function authRes(u){const[g,cb,l]=LV[u.level];return{token:tok,user:u,notices:{clinician:u.level==="critical"}}}
function login(email,pw){const u=db.users.find(x=>x.email===email.trim().toLowerCase());if(!u||u.pw!==pw)return null;tok="mock."+btoa(u.id+":"+Date.now())+"."+Math.random().toString(36).slice(2);me=u;save();return authRes(u)}
function register(f){const email=f.email.trim().toLowerCase();if(!f.name.trim()||!email||!f.pw)return"Name, email and password are required.";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return"Enter a valid email address.";if(f.pw.length<8)return"Password must be at least 8 characters.";
 if(db.users.some(x=>x.email===email))return"An account with that email already exists.";
 const u={id:Date.now(),name:f.name.trim(),email,pw:f.pw,setting:f.setting,level:f.level,age:+f.age||null,...lim(f.setting,f.level),target:null,premium:false};db.users.push(u);login(email,f.pw);return null}
const myPlans=()=>db.plans.filter(p=>p.u===me.id).sort((a,b)=>b.date.localeCompare(a.date)),myW=()=>db.weights.filter(w=>w.u===me.id).sort((a,b)=>a.date.localeCompare(b.date));
const planDishes=p=>p.items.map(i=>dish(i.d)).filter(Boolean);
function toast(m){const t=$("tg");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
// ---- views ----
const mtr=(l,v,max,txt,over)=>`<div class="mtr"><div class="r"><span>${l}</span><span>${txt}</span></div><div class="bar"><div class="${over?"o":""}" style="width:${Math.min(100,v/max*100)}%"></div></div></div>`;
const gchip=g=>{const[c,l]=band(g);return`<span class="cp ${c}">${l} ${g}</span>`};
function shell(inner){const u=me;return`<div class="top"><div class="logo"><i></i>GlucoPlate</div><div><span class="bdg ${u.premium?"p":""}">${u.premium?"Premium":"Free plan"}</span> <span class="sm">${esc(u.name)}</span> <button class="b gh s" data-a="out">Log out</button></div></div>
<div class="nav" role="navigation">${[["dash","Today"],["dishes","Dishes"],["plans","Plans"],["prog","Progress"],["set","Settings"],["prem","Premium"]].map(n=>`<button data-v="${n[0]}" ${view===n[0]?'aria-current="page"':""}>${n[1]}</button>`).join("")}</div>
${u.level==="critical"?'<div class="bn c" role="alert">Consult your clinician. Your profile is marked critical, so check any meal plan with your clinician first, and never change medication or insulin because of this app.</div>':""}
<div class="bn i">GlucoPlate is a planning aid, not medical advice. Check your meal and carb targets with your doctor or dietitian.</div>${inner}`}
function vDash(){const u=me,today=myPlans().find(p=>p.date===day(0));if(!draft&&!today)draft=gen(u);
 const items=today?today.items.map(i=>({d:dish(i.d),st:i.st})):draft.map(d=>({d,st:null})),c=items.map(i=>i.d),t=tot(c),ok=t.cost<=u.budget&&t.c<=u.carb&&t.gi<=u.gi;
 return`<div class="g"><section class="pn"><h2>Today's plate for ${esc(u.name.split(" ")[0])}</h2><p class="sub">${ST[u.setting][4]}, ${LV[u.level][2]}. ${today?"Saved plan.":"Preview, not saved yet."}</p>
${items.map((x,i)=>`<div class="ml"><div class="sl">${SL[i]}</div><div><div class="nm">${esc(x.d.name)}</div><div class="mt">${x.d.c} g carbs, ${x.d.p} g protein, ${x.d.kcal} kcal</div>${gchip(x.d.gi)}${x.d.fl.includes("s")?'<span class="cp lo">Soft texture</span>':""}<br>${today?`<button class="b gh s" data-a="eat" data-i="${i}">${x.st==="eaten"?"Eaten, undo":"Mark as eaten"}</button>`:`<button class="b gh s" data-a="swap" data-i="${i}">Swap dish</button>`}</div><div class="pr">${KES(x.d.cost)}</div></div>`).join("")}
<p class="nm" style="margin-top:10px">${ok?"This plan fits your budget, carbs and GI limit.":"No plan fully fits your limits. This is the closest match."}</p>
${t.kc<u.kcal*.8*.7?'<div class="sm">Calories are low for the day. Add a snack from the ideas below.</div>':""}
<div class="ac">${today?'<button class="b gh" data-a="del" data-id="'+today.id+'">Discard and re-plan</button>':'<button class="b" data-a="save">Save today\'s plan</button><button class="b gh" data-a="regen">Plan again</button>'}</div>
<p class="sm" style="margin-top:12px">Snack ideas within your limits: ${all().filter(d=>d.t==="S"&&d.gi<=u.gi&&d.c<=u.carb/6).map(d=>esc(d.name)+" ("+KES(d.cost)+")").join(", ")||"none"}</p></section>
<aside><section class="pn"><h2>Your limits today</h2><p class="sub">Budget ${KES(u.budget)}, carbs up to ${u.carb} g, GI up to ${u.gi}.</p>
${mtr("Budget",t.cost,u.budget,KES(t.cost)+" of "+KES(u.budget),t.cost>u.budget)}${mtr("Carbohydrates",t.c,u.carb,t.c+" of "+u.carb+" g",t.c>u.carb)}${mtr("Highest GI",t.gi,100,t.gi+" (limit "+u.gi+")",t.gi>u.gi)}${mtr("Calories",t.kc,u.kcal,t.kc+" of ~"+u.kcal,false)}</section></aside></div>`}
function vDishes(){const u=me,f=filt;return`<section class="pn"><h2>Kenyan dishes</h2><p class="sub">${all().length} dishes with KES prices, carbs and glycemic index.</p>
<div class="fr"><div><label for="q">Search</label><input id="q" value="${esc(f.q)}"></div><div><label for="tf">Meal</label><select id="tf">${[["all","All"],["m","Morning"],["M","Lunch or dinner"],["S","Snacks"]].map(o=>`<option value="${o[0]}" ${f.t===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>
<div><label for="sf">Show</label><select id="sf"><option value="0">All dishes</option><option value="1" ${f.safe?"selected":""}>Within my GI limit</option></select></div></div><div class="dg" id="dl" style="margin-top:12px"></div></section>
<section class="pn"><h2>Add your own dish</h2><div class="fr"><div><label for="n1">Name</label><input id="n1"></div><div><label for="n2">Meal</label><select id="n2"><option value="m">Morning</option><option value="M">Lunch or dinner</option><option value="S">Snack</option></select></div><div><label for="n3">Price (KSh)</label><input id="n3" type="number" min="0"></div><div><label for="n4">Carbs (g)</label><input id="n4" type="number" min="0"></div><div><label for="n5">Protein (g)</label><input id="n5" type="number" min="0"></div><div><label for="n6">Glycemic index</label><input id="n6" type="number" min="0" max="100" value="50"></div></div><div class="ac"><button class="b" data-a="addd">Add dish</button></div><div class="er" id="e1"></div></section>`}
function dlist(){const u=me,f=filt,q=f.q.toLowerCase();$("dl").innerHTML=all().filter(d=>(f.t==="all"||d.t===f.t||(f.t==="M"&&(d.t==="A"||d.t==="E")))&&d.name.toLowerCase().includes(q)&&(!f.safe||d.gi<=u.gi)).map(d=>`<div class="dc"><div class="nm">${esc(d.name)}</div><div class="mt">${TL[d.t]}, ${KES(d.cost)}</div><div class="mt">${d.c} g carbs, ${d.p} g protein, ${d.kcal} kcal</div>${gchip(d.gi)}${d.gi>u.gi?'<span class="cp hi">Above your limit</span>':""}${d.id>=1000?`<br><button class="b d s" data-a="rmd" data-id="${d.id}">Delete</button>`:""}</div>`).join("")||'<p class="sm">No dishes match. Clear the search or filter.</p>'}
function vPlans(){const ps=myPlans();return`<section class="pn"><h2>Plan history</h2><p class="sub">${ps.length} saved plans.</p>${ps.map(p=>{const c=planDishes(p),t=tot(c);return`<div class="row" style="grid-template-columns:96px 1fr auto"><b>${p.date}</b><span>${c.map(d=>esc(d.name.split(" (")[0])).join(" · ")}<br><span class="sm">${t.c} g carbs, ${p.items.filter(i=>i.st==="eaten").length}/3 eaten</span></span><b>${KES(t.cost)}</b></div>`}).join("")||'<p class="sm">No plans yet. Save one from the Today tab.</p>'}</section>`}
function wchart(ws,t){if(!ws.length)return"";const v=ws.map(x=>x.w),lo=Math.min(...v,t||1e9)-1,hi=Math.max(...v,t||0)+1,X=i=>20+i*(260/Math.max(1,ws.length-1)),Y=x=>10+(hi-x)/(hi-lo)*70;
 return`<svg viewBox="0 0 300 100" width="100%" role="img" aria-label="Weight trend">${t?`<line x1="20" x2="280" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--mg)" stroke-dasharray="4 4"/><text x="282" y="${Y(t)+4}">goal</text>`:""}<polyline fill="none" stroke="var(--lf)" stroke-width="3" points="${ws.map((x,i)=>X(i)+","+Y(x.w)).join(" ")}"/>${ws.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3.5" fill="var(--lf)"/>`).join("")}<text x="14" y="98">${ws[0].date}</text><text x="226" y="98">${ws[ws.length-1].date}</text></svg>`}
function vProg(){const ws=myW(),ps=myPlans(),spent=ps.reduce((a,p)=>a+p.items.filter(i=>i.st==="eaten").reduce((s,i)=>s+(dish(i.d)?.cost||0),0),0),bud=ps.reduce((a,p)=>a+p.budget,0);
 return`<div class="g2"><section class="pn"><h2>Weight</h2><p class="sub">${ws.length?ws[ws.length-1].w+" kg now"+(me.target?", goal "+me.target+" kg":""):"No entries yet."}</p>${wchart(ws,me.target)}
<label for="wv">Log today's weight (kg)</label><input id="wv" type="number" step="0.1"><div class="ac"><button class="b" data-a="addw">Save weight</button></div><div class="er" id="e2"></div></section>
<section class="pn"><h2>Spending and carbs</h2><p class="sub">Across ${ps.length} saved plans.</p>${mtr("Spent on eaten meals",spent,Math.max(bud,1),KES(spent)+" of "+KES(bud),spent>bud)}<p class="nm">${bud>=spent?"Saved "+KES(bud-spent)+" against budget.":"Over budget by "+KES(spent-bud)+"."}</p>
<h3 style="font-size:16px;margin-top:10px">Carbs per day (limit ${me.carb} g)</h3>${ps.slice(0,7).reverse().map(p=>{const c=tot(planDishes(p)).c;return mtr(p.date,c,me.carb,c+" g",c>me.carb)}).join("")}</section></div>`}
const opts=(o,sel)=>Object.keys(o).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${o[k][2]??o[k][4]}</option>`).join("");
function vSet(){const u=me;return`<section class="pn"><h2>Profile and limits</h2><p class="sub">Changing setting or level resets your limits to the suggested values. You can then adjust them.</p>
<div class="fr"><div><label for="s1">Setting</label><select id="s1">${opts(ST,u.setting)}</select></div><div><label for="s2">Diabetes level</label><select id="s2">${opts(LV,u.level)}</select></div><div><label for="s3">Daily budget (KSh)</label><input id="s3" type="number" value="${u.budget}"></div><div><label for="s4">Carb limit (g/day)</label><input id="s4" type="number" value="${u.carb}"></div><div><label for="s5">GI limit</label><input id="s5" type="number" value="${u.gi}"></div><div><label for="s6">Goal weight (kg)</label><input id="s6" type="number" step="0.1" value="${u.target||""}"></div></div>
<div class="ac"><button class="b" data-a="sets">Save settings</button></div></section>`}
function vPrem(){const u=me;return`<div class="g2"><section class="pn"><h2>Premium, KSh 20</h2><p class="sub">Unlocks the 7-day plan. Pay with M-Pesa.</p><label for="ph">M-Pesa number</label><input id="ph" inputmode="tel" value="0712 345 678"><div class="ac"><button class="b" id="pay" data-a="pay" ${u.premium?"disabled":""}>${u.premium?"Premium active":"Pay KSh 20 with M-Pesa"}</button></div><div id="stk"></div><p class="sm" style="margin-top:8px">Sandbox simulation. No real money moves.</p></section>
<section class="pn"><h2>7-day plan</h2><p class="sub">${u.premium?"Different meals each day within your limits.":"Premium feature."}</p>${u.premium?'<button class="b" data-a="week">Build 7-day plan</button><div id="wk"></div>':'<p class="sm">Pay KSh 20 to unlock.</p>'}</section></div>`}
function vAuth(m){const f=m==="reg";return`<div class="au"><div class="logo" style="margin-bottom:10px"><i></i>GlucoPlate</div><h1 style="font-size:28px;margin-bottom:6px">Eat well on what you have today.</h1><p class="sub">Kenyan meals that fit your budget, carbs and glycemic index.</p>
<div class="bn i">GlucoPlate is a planning aid, not medical advice.</div><section class="pn"><h2>${f?"Create account":"Log in"}</h2>
${f?'<label for="a0">Name</label><input id="a0" autocomplete="name">':""}<label for="a1">Email</label><input id="a1" type="email" autocomplete="email"><label for="a2">Password</label><input id="a2" type="password" autocomplete="${f?"new-password":"current-password"}">
${f?`<div class="fr"><div><label for="a3">Setting</label><select id="a3">${opts(ST,"working_class")}</select></div><div><label for="a4">Level</label><select id="a4">${opts(LV,"type2_controlled")}</select></div><div><label for="a5">Age</label><input id="a5" type="number"></div></div>`:""}
<div class="ac"><button class="b" data-a="${f?"reg":"login"}">${f?"Create account":"Log in"}</button><button class="b gh" data-a="tog" data-m="${f?"login":"reg"}">${f?"I have an account":"Create account"}</button></div><div class="er" id="ae" role="alert"></div></section>
${f?"":`<section class="pn"><h2>Try a demo account</h2><p class="sub">Password for all: Demo@12345</p><div class="dm">${PERS.map(p=>`<button data-a="demo" data-e="${p[1]}@glucoplate.demo"><b>${p[0]}</b><br><span class="sm">${ST[p[2]][4]}, ${LV[p[3]][2]}</span></button>`).join("")}</div></section>`}</div>`}
function draw(m){if(!me){$("app").innerHTML=vAuth(m||"login");return}
 const V={dash:vDash,dishes:vDishes,plans:vPlans,prog:vProg,set:vSet,prem:vPrem}[view];$("app").innerHTML=shell(V());if(view==="dishes")dlist()}
// ---- events ----
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.v){view=b.dataset.v;draw();return}
 const a=b.dataset.a,v=id=>$(id)&&$(id).value;if(!a)return;
 if(a==="tog")return draw(b.dataset.m);
 if(a==="login"||a==="demo"){const r=login(a==="demo"?b.dataset.e:v("a1"),a==="demo"?"Demo@12345":v("a2"));if(!r){$("ae").textContent="Invalid email or password.";return}view="dash";draft=null;return draw()}
 if(a==="reg"){const er=register({name:v("a0"),email:v("a1"),pw:v("a2"),setting:v("a3"),level:v("a4"),age:v("a5")});if(er){$("ae").textContent=er;return}view="dash";draft=null;toast("Account created");return draw()}
 if(a==="out"){me=null;tok=null;draft=null;try{localStorage.removeItem("gp_tok")}catch(x){}return draw()}
 if(a==="regen"){draft=gen(me,new Set(draft.map(d=>d.id)));return draw()}
 if(a==="swap"){const i=+b.dataset.i,c=pool(i).filter(d=>!draft.includes(d)).map(d=>{const x=[...draft];x[i]=d;return{d,...ev(x,me)}}).sort((p,q)=>p.v-q.v||p.sc-q.sc);if(c.length)draft[+i]=c[0].d;return draw()}
 if(a==="save"){db.plans.push({id:db.n++,u:me.id,date:day(0),budget:me.budget,items:draft.map((d,j)=>({d:d.id,s:j,st:"planned"}))});draft=null;save();toast("Plan saved");return draw()}
 if(a==="eat"){const p=myPlans().find(x=>x.date===day(0)),it=p.items[+b.dataset.i];it.st=it.st==="eaten"?"planned":"eaten";save();return draw()}
 if(a==="del"){db.plans=db.plans.filter(p=>p.id!==+b.dataset.id);draft=null;save();return draw()}
 if(a==="addd"){const n=v("n1").trim();if(!n){$("e1").textContent="Enter a dish name.";return}const c=Math.max(0,+v("n4")||0),p=Math.max(0,+v("n5")||0);
  db.custom.push(mk(1000+Date.now()%1e6,n,v("n2"),Math.max(0,+v("n3")||0),c,p,0,Math.min(100,Math.max(0,+v("n6")||50)),""));save();toast("Dish added");return draw()}
 if(a==="rmd"){db.custom=db.custom.filter(d=>d.id!==+b.dataset.id);save();return draw()}
 if(a==="addw"){const w=+v("wv");if(!(w>20&&w<300)){$("e2").textContent="Enter a weight between 20 and 300 kg.";return}db.weights=db.weights.filter(x=>!(x.u===me.id&&x.date===day(0)));db.weights.push({u:me.id,date:day(0),w});me.age=me.age;save();toast("Weight saved");return draw()}
 if(a==="sets"){const s=v("s1"),l=v("s2");if(s!==me.setting||l!==me.level){Object.assign(me,{setting:s,level:l},lim(s,l))}
  const bd=+v("s3"),cb=+v("s4"),gi=+v("s5");if(bd>0)me.budget=bd;if(cb>0)me.carb=cb;if(gi>0&&gi<=100)me.gi=gi;me.target=+v("s6")||null;draft=null;save();toast("Settings saved");return draw()}
 if(a==="pay"){const ph=v("ph").replace(/\s/g,"");if(!/^(0|254|\+254)?[17]\d{8}$/.test(ph)){$("stk").innerHTML='<div class="st">Enter a valid Safaricom number, for example 0712 345 678.</div>';return}
  b.disabled=true;$("stk").innerHTML='<div class="st" role="status">Check your phone. Enter your M-Pesa PIN to pay KSh 20 to GlucoPlate.</div>';
  setTimeout(()=>{me.premium=true;save();$("stk")&&($("stk").innerHTML='<div class="st"><b>Payment received.</b> Receipt SBX'+Math.random().toString(36).slice(2,9).toUpperCase()+'. Premium is now active.</div>');setTimeout(()=>{if(view==="prem")draw()},1800)},3200);return}
 if(a==="week"){const ex=new Set();$("wk").innerHTML=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(n=>{const c=gen(me,ex);c.forEach(d=>ex.add(d.id));if(ex.size>24)ex.clear();return`<div class="row"><b>${n}</b><span>${c.map(d=>esc(d.name.split(" (")[0])).join(" · ")}</span><b>${KES(tot(c).cost)}</b></div>`}).join("")}});
document.addEventListener("input",e=>{if(e.target.id==="q"){filt.q=e.target.value;dlist()}});
document.addEventListener("change",e=>{if(e.target.id==="tf"){filt.t=e.target.value;dlist()}if(e.target.id==="sf"){filt.safe=e.target.value==="1";dlist()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!me&&e.target.tagName==="INPUT")document.querySelector("[data-a=login],[data-a=reg]")?.click()});
try{db=JSON.parse(localStorage.getItem("gp_db"))}catch(e){}if(!db||!db.users)seed();
try{tok=localStorage.getItem("gp_tok");if(tok){const id=+atob(tok.split(".")[1]).split(":")[0];me=db.users.find(u=>u.id===id)||null}}catch(e){}
draw();
</script></body></html>
